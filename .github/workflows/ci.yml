name: CI

# Pull requests run CI once per push. A plain branch push does not, because a
# push and its pull request have different refs and so never cancel each other
# (two full runs per change). Merges are gated by the deploy workflows, which
# call this one; use "Run workflow" for a branch that has no pull request yet.
on:
  workflow_call:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Verify public package sources
        run: npm run check:lockfile
      - run: npm ci
      - run: npm run check:dependencies
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:docs
      - run: npm test
      - run: npm run build
      - name: Run browser smoke tests with pinned Playwright
        run: >-
          docker run --rm --ipc=host
          --user "$(id -u):$(id -g)" --env HOME=/tmp --env CI=true
          --volume "$PWD:/work" --workdir /work
          mcr.microsoft.com/playwright:v1.56.0-noble@sha256:35246d87a7c88ea9b771c65d33171b2611b02a8253b4b12ce6f94376c55f99f2
          npm run test:smoke
      - name: Save verified production assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
